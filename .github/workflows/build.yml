name: Build and attest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - name: Verify committed bundles match source
        run: git diff --exit-code -- main.js styles.css manifest.json
      - name: Validate release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e 'const m = require("./manifest.json"); if (process.env.RELEASE_TAG !== m.version) throw new Error("Release tag must match manifest version: " + m.version)'

  attest:
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: git diff --exit-code -- main.js styles.css manifest.json
      - name: Attest built plugin files
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json
      - name: Upload exact attested files to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" main.js styles.css manifest.json --clobber
      - name: Publish a versioned release from an explicit release commit
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.event.head_commit.message }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          VERSION=$(node -p 'require("./manifest.json").version')
          EXPECTED="Release $VERSION"
          if [ "$RELEASE_COMMIT" != "$EXPECTED" ]; then
            echo "Release commit must exactly match $EXPECTED"
            exit 1
          fi
          gh release create "$VERSION" main.js styles.css manifest.json \
            --target "$RELEASE_SHA" \
            --title "Persian Reminder $VERSION" \
            --notes-file CHANGELOG.md
